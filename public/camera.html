<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Grok Bot Live Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      color: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      overflow: hidden;
    }
    video#cam {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    #status {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(8px);
      font-size: 13px;
      letter-spacing: 0.02em;
      max-width: calc(100% - 24px);
    }
    #dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #facc15;
      flex-shrink: 0;
    }
    #status.live #dot {
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: pulse 1.4s ease-out infinite;
    }
    #status.error #dot { background: #ef4444; animation: none; }
    #status.error { background: rgba(80, 0, 0, 0.75); }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
      70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    #msg { line-height: 1.3; }
    #retry {
      display: none;
      position: absolute;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      color: #111;
      background: #fff;
    }
    #retry.show { display: block; }
  </style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <div id="status"><span id="dot"></span><span id="msg">Requesting camera permission…</span></div>
  <button id="retry" type="button">Try again</button>
  <script>
    const KEY = new URLSearchParams(location.search).get("k") || "__VISION_KEY__";
    const video = document.getElementById("cam");
    const statusEl = document.getElementById("status");
    const msgEl = document.getElementById("msg");
    const retryBtn = document.getElementById("retry");
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const MAX_W = 1280;
    const INTERVAL_MS = 250;
    const JPEG_Q = 0.7;

    let stream = null;
    let timer = null;
    let sending = false;
    let sent = 0;
    let lastErr = "";

    function setStatus(kind, text) {
      statusEl.className = kind === "live" ? "live" : kind === "error" ? "error" : "";
      msgEl.textContent = text;
      retryBtn.classList.toggle("show", kind === "error");
    }

    function liveLabel() {
      const extra = lastErr ? " · send retrying" : "";
      return "LIVE · streaming to Grok Bot" + (sent ? " · " + sent + " frames" : "") + extra;
    }

    async function start() {
      stopCapture();
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      if (!window.isSecureContext) {
        setStatus("error", "Camera needs HTTPS or localhost (secure context).");
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("error", "This browser has no camera API.");
        return;
      }
      if (!KEY || KEY === "__VISION_KEY__") {
        setStatus("error", "Missing camera key. Open the URL from start_camera (it includes ?k=).");
        return;
      }
      setStatus("", "Requesting camera permission…");
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false,
        });
      } catch (err) {
        const name = err && err.name ? err.name : "Error";
        const hint =
          name === "NotAllowedError" ? "Permission denied. Allow the camera and tap Try again."
          : name === "NotFoundError" ? "No camera found on this device."
          : name === "NotReadableError" ? "Camera is in use by another app."
          : (err && err.message) || String(err);
        setStatus("error", hint);
        return;
      }
      video.srcObject = stream;
      try { await video.play(); } catch (_) { /* autoplay with muted + playsinline */ }
      setStatus("live", liveLabel());
      timer = setInterval(capture, INTERVAL_MS);
    }

    function stopCapture() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function capture() {
      if (document.hidden || sending) return;
      if (!video.videoWidth || !video.videoHeight) return;
      let w = video.videoWidth;
      let h = video.videoHeight;
      if (w > MAX_W) {
        h = Math.round((h * MAX_W) / w);
        w = MAX_W;
      }
      if (canvas.width !== w) canvas.width = w;
      if (canvas.height !== h) canvas.height = h;
      ctx.drawImage(video, 0, 0, w, h);
      sending = true;
      canvas.toBlob(async (blob) => {
        if (!blob) {
          sending = false;
          return;
        }
        try {
          const res = await fetch("/frame", {
            method: "POST",
            headers: {
              "Content-Type": "image/jpeg",
              "X-Vision-Key": KEY,
            },
            body: blob,
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          sent += 1;
          lastErr = "";
          setStatus("live", liveLabel());
        } catch (err) {
          lastErr = err && err.message ? err.message : "send failed";
          setStatus("live", liveLabel());
        } finally {
          sending = false;
        }
      }, "image/jpeg", JPEG_Q);
    }

    retryBtn.addEventListener("click", start);
    start();
  </script>
</body>
</html>
